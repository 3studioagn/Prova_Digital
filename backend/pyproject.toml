[project]
name = "rastreio-provas-digitais"
version = "0.1.0"
description = "Sistema de Rastreio de Provas Digitais - 3Studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pyjwt[crypto]>=2.8,<3.0",
    "boto3>=1.34,<2.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "qrcode[pil]>=7.4,<8.0",
    "fpdf2>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    # pytest-asyncio <1.0 usa asyncio.get_event_loop_policy() que e deprecada
    # no Python 3.14. Ver CHANGELOG Sessao 8b para o contexto do bump.
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.4,<1.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
# Migrations Alembic sao semi-geradas (boilerplate Alembic + SQL literal em
# op.execute) — excluidas do lint conforme padrao da comunidade Python/Alembic.
# Debito historico: 6 erros pre-existentes em migrations/ (2 F401, 1 F541, 3
# E501 em SQL inline) detectados no inicio da Wave 3 Lote A. Ver
# WAVE3_BLOCKERS.md secao B-01 para o contexto e ADR-081 para a decisao.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
