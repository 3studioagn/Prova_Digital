name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes unitarios
        run: pytest tests/ -v
        env:
          # Variaveis minimas para os testes rodarem sem .env real
          SUPABASE_URL: https://fake.supabase.co
          SUPABASE_ANON_KEY: fake-anon-key
          SUPABASE_SERVICE_ROLE_KEY: fake-service-role-key
          SUPABASE_JWT_SECRET: fake-jwt-secret
          DATABASE_URL: postgresql+asyncpg://fake:fake@localhost:5432/fake
          R2_ACCOUNT_ID: fake
          R2_ACCESS_KEY_ID: fake
          R2_SECRET_ACCESS_KEY: fake
          R2_ENDPOINT_URL: https://fake.r2.cloudflarestorage.com

  # Deploy em staging: aplica migrations e faz deploy automatico.
  # Deploy em producao fica manual nesta primeira fase.
  deploy-staging:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -e .

      - name: Aplicar migrations Alembic em staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          # Converte asyncpg -> psycopg2 para Alembic
          pip install psycopg2-binary
          alembic upgrade head

      # O deploy automatico em staging sera configurado apos
      # definicao da plataforma (Railway/Fly.io) - Fase G.
